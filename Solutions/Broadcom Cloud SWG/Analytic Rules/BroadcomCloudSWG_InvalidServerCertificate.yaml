id: 5b3a1d44-7c2e-4f9a-9c1e-3b8f7a210a10
name: Broadcom Cloud SWG - Invalid or expired server certificate
description: |
  Identifies transactions where Broadcom Cloud SWG detected server-side TLS certificate errors such as untrusted issuers or expired certificates.
severity: Low
status: Available
requiredDataConnectors:
  - connectorId: BroadcomCloudSWGDefinition
    dataTypes:
      - BroadcomCloudSWG_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CommandAndControl
  - DefenseEvasion
relevantTechniques:
  - T1071
  - T1573
query: |
  BroadcomCloudSWG_CL
  | where ProxyTlsServerCertSignatureErrors has_any ("expired", "untrusted-issuer", "self-signed", "revoked")
  | extend AccountName = tostring(split(UserName, "\\\\")[-1]), AccountDomain = UserDomain
  | extend Url = strcat(UrlScheme, "://", UrlHostname, UrlPath)
  | project TimeGenerated, AccountName, AccountDomain, UserName, UserDomain, SrcIp, DeviceName, DstIp, UrlHostname, Url, ProxyTlsServerCertSignatureErrors, ProxyTlsCertificateSubject, ProxyTlsVersion, UrlCategories, SeverityId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
      - identifier: UPNSuffix
        columnName: AccountDomain
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIp
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
version: 1.0.0
kind: Scheduled

