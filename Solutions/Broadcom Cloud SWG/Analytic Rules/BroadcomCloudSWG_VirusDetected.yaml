id: 5b3a1d44-7c2e-4f9a-9c1e-3b8f7a210a02
name: Broadcom Cloud SWG - Virus signature detected
description: |
  Identifies denied web transactions where Broadcom Cloud SWG blocked access to known malware/virus-categorized destinations. Note: Antivirus scanning verdict data (VirusID) is not available in OCSF 1.6 Network Activity events. This rule uses URL categories and action as the primary detection signal.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: BroadcomCloudSWGDefinition
    dataTypes:
      - BroadcomCloudSWG_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
relevantTechniques:
  - T1204
  - T1105
query: |
  BroadcomCloudSWG_CL
  | where ActionResult =~ "DENIED"
  | where Verdict has_any ("malware", "virus", "malicious") or UrlCategories has_any ("Malware", "Virus", "Spyware", "Malicious Sources/Malnets")
  | extend AccountName = tostring(split(UserName, "\\\\")[-1]), AccountDomain = UserDomain
  | extend Url = strcat(UrlScheme, "://", UrlHostname, UrlPath)
  | project TimeGenerated, AccountName, AccountDomain, UserName, UserDomain, SrcIp, DeviceName, DstIp, UrlHostname, AppName, Url, ActionResult, Verdict, MessageCode, UrlCategories, SeverityId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
      - identifier: UPNSuffix
        columnName: AccountDomain
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIp
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
version: 1.0.0
kind: Scheduled

