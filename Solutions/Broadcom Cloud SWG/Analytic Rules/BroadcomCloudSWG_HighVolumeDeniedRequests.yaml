id: 5b3a1d44-7c2e-4f9a-9c1e-3b8f7a210a11
name: Broadcom Cloud SWG - High volume of denied requests from single client
description: |
  Identifies clients with an unusually high number of denied requests through Broadcom Cloud SWG in a short period, which may indicate policy circumvention or scanning.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: BroadcomCloudSWGDefinition
    dataTypes:
      - BroadcomCloudSWG_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CommandAndControl
  - Discovery
relevantTechniques:
  - T1071
query: |
  let threshold = 100;
  BroadcomCloudSWG_CL
  | where ActionResult =~ "DENIED"
  | summarize DeniedCount = count(), DistinctDestinations = dcount(UrlHostname), Destinations = make_set(UrlHostname, 50), TopCategories = make_set(UrlCategories, 25), StartTime = min(TimeGenerated), EndTime = max(TimeGenerated) by SrcIp, UserName, DeviceName
  | where DeniedCount >= threshold
  | extend AccountName = tostring(split(UserName, "\\\\")[-1]), AccountDomain = UserDomain
  | order by DeniedCount desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
      - identifier: UPNSuffix
        columnName: AccountDomain
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIp
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
version: 1.0.0
kind: Scheduled

