id: 7c4b2e55-8d3f-4a1b-9d2f-4c9a8b321b05
name: Broadcom Cloud SWG - Suspicious sandbox verdict downloads
description: |
  'Surfaces file downloads through Broadcom Cloud SWG where Malware Analysis returned a SUSPICIOUS sandbox verdict or the content was detonated. These borderline detections are valuable hunting leads for emerging or evasive malware.'
requiredDataConnectors:
  - connectorId: BroadcomCloudSWGDefinition
    dataTypes:
      - BroadcomCloudSWG_CL
tactics:
  - Execution
relevantTechniques:
  - T1204
  - T1105
query: |
  BroadcomCloudSWG_CL
  | where ActionResult =~ "DENIED"
  | where UrlCategories has_any ("Malware", "Spyware", "Malicious Sources/Malnets", "Suspicious") or Verdict has_any ("malware", "virus", "malicious")
  | project TimeGenerated, UserName, UserDomain, SrcIp, DeviceName, UrlHostname, UrlPath, ActionResult, Verdict, MessageCode, UrlCategories, SeverityId, TrafficBytesIn, ConnectionUid
  | order by TimeGenerated desc
  
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: UserName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIp
  - entityType: FileHash
    fieldMappings:
      - identifier: Algorithm
        columnName: Algorithm
      - identifier: Value
        columnName: SHA256
version: 1.0.0

