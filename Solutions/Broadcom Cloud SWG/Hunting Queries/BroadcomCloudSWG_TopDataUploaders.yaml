id: 7c4b2e55-8d3f-4a1b-9d2f-4c9a8b321b02
name: Broadcom Cloud SWG - Top data uploaders
description: |
  'Ranks users by total outbound bytes (upload + client bytes) through Broadcom Cloud SWG. Use this hunt to identify potential data exfiltration candidates and unsanctioned data movement to external web applications.'
requiredDataConnectors:
  - connectorId: BroadcomCloudSWGDefinition
    dataTypes:
      - BroadcomCloudSWG_CL
tactics:
  - Exfiltration
relevantTechniques:
  - T1567
query: |
  BroadcomCloudSWG_CL
  | summarize TotalUploadBytes = sum(TrafficBytesOut), TransactionCount = count(), DistinctApps = dcount(AppName), Apps = make_set(AppName, 25), Destinations = make_set(UrlHostname, 25) by UserName, UserDomain, SrcIp
  | extend TotalUploadMB = round(TotalUploadBytes / 1024.0 / 1024.0, 2)
  | order by TotalUploadBytes desc
  | take 100
  
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: UserName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIp
version: 1.0.0

